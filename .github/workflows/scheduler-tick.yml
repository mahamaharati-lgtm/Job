# Optional backup scheduler. The deployed server already runs its own scheduler; this
# workflow only wakes it on hosts that sleep when idle. Disabled unless both repository
# secrets are set: APP_URL (e.g. https://your-app.fly.dev) and CRON_SECRET (same as the server's).
name: Scheduler tick
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the job pipeline
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not configured; skipping."; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/internal/tick"
